name: "docker"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  docker-push:
    strategy:
      matrix:
        image:
          - spiced
          - superset-granian
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: docker/login-action@v3
      if: github.event_name != 'pull_request'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v15
      with:
        name: 'cybertreiber'
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: nix build -L .#images.${{ matrix.image }} && ./result | docker load
    - run: docker run --rm ${{ matrix.image }} --help
    - name: Publish image
      if: github.event_name != 'pull_request'
      run: |
        docker tag ${{ matrix.image }} ghcr.io/ahirner/${{ matrix.image }}
        docker tag ${{ matrix.image }} ghcr.io/ahirner/${{ matrix.image }}:"${GITHUB_SHA:0:8}"
        docker push ghcr.io/ahirner/${{ matrix.image }} -a
